# Runs the synthetic end-to-end test on CPU. No personal photos and no GPU.
name: smoke

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU PyTorch
        # Install the CPU wheels first. The following step sees torch as
        # already satisfied and does not replace them with the large CUDA build.
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install the other dependencies
        run: pip install -r requirements.txt

      - name: Smoke test
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests -q --tb=short
